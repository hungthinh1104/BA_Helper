services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ba_helper
      POSTGRES_USER: ba_helper
      POSTGRES_PASSWORD: ba_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_helper -d ba_helper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      WORKSPACE_MODE: dev-single-user
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-jwt-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://ba_helper:ba_helper@postgres:5432/ba_helper
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      WORKSPACE_MODE: dev-single-user
      DATABASE_URL: postgresql://ba_helper:ba_helper@postgres:5432/ba_helper
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
