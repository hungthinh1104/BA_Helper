name: ci

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ba_helper_test
          POSTGRES_USER: ba_helper
          POSTGRES_PASSWORD: ba_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ba_helper -d ba_helper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ba_helper:ba_helper@localhost:5432/ba_helper_test
      DATABASE_URL_TEST: postgresql://ba_helper:ba_helper@localhost:5432/ba_helper_test
      REDIS_URL: redis://localhost:6379
      REDIS_URL_TEST: redis://localhost:6379
      WORKSPACE_MODE: dev-single-user
      ENABLE_DEV_LOGIN: "true"
      JWT_SECRET: ci-jwt-secret-not-for-production
      AI_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --dir apps/api exec prisma migrate deploy --config prisma.config.ts --schema prisma/schema.prisma

      - name: Domain pack governance
        run: pnpm verify:domain-packs

      - name: Worker boundary check (no api imports)
        run: |
          if grep -rE 'from.*(@ba-helper/api|apps/api/)' apps/worker/src/; then
            echo "BOUNDARY VIOLATION: worker must not import from apps/api"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web production build
        run: pnpm --filter web... build

      - name: Analyzer tests
        run: pnpm test:analyzer

      - name: App tests
        run: pnpm test:ci

      - name: E2E tests
        run: pnpm test:e2e

      - name: Golden path demo
        run: pnpm demo:golden-path

      - name: Multi-repo golden path demo
        run: pnpm demo:multi-repo-golden-path
