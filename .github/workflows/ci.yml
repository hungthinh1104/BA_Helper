name: ci

"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ba_helper_test
          POSTGRES_USER: ba_helper
          POSTGRES_PASSWORD: ba_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ba_helper -d ba_helper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ba_helper:ba_helper@localhost:5432/ba_helper_test
      DATABASE_URL_TEST: postgresql://ba_helper:ba_helper@localhost:5432/ba_helper_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_URL_TEST: redis://localhost:6379/1
      WORKSPACE_MODE: dev-single-user
      ENABLE_DEV_LOGIN: "true"
      JWT_SECRET: ci-jwt-secret-not-for-production
      NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production
      AI_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Checkout pinned NestJS comprehension corpus
        uses: actions/checkout@v7.0.1
        with:
          repository: leosuncin/nest-api-example
          ref: b49ae92a6c0b0db39b6542338a2ffea3eda15717
          path: tmp/corpora/nest-api-example
          persist-credentials: false

      - name: Production dependency advisories (high and critical)
        run: pnpm verify:dependencies

      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --dir apps/api exec prisma migrate deploy --config prisma.config.ts --schema prisma/schema.prisma

      - name: Domain pack governance
        run: pnpm verify:domain-packs

      - name: Scan source-omission regression
        run: |
          pnpm exec jest --config jest.analyzer.config.ts --runInBand packages/analyzer/tests/scanner/core/safe-file-enumerator.spec.ts
          pnpm exec jest --config jest.unit.config.ts --runInBand packages/backend-runtime/src/scanner/application/scan-health-diagnostics.spec.ts

      - name: Runtime config isolation regression
        run: pnpm exec jest --config jest.ci.config.ts --runInBand apps/api/src/bootstrap/runtime-config.spec.ts

      - name: Analyzer quality gate
        run: pnpm verify:analyzer-quality

      - name: Public NestJS static trace corpus
        run: pnpm verify:public-test-trace

      - name: Adversarial static evidence verification
        run: pnpm verify:adversarial-evidence

      - name: Application static trace accuracy and regression
        run: pnpm verify:application-test-trace

      - name: Static test trace scalability benchmark
        run: pnpm benchmark:static-test-graph -- ci

      - name: Upload analyzer scorecard
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: analyzer-quality-scorecard
          path: |
            artifacts/evaluation/analyzer-scorecard.json
            artifacts/evaluation/adversarial-evidence-verification.json
            artifacts/evaluation/public-test-trace-scorecard.json
            artifacts/evaluation/application-test-trace-scorecard.json
            artifacts/performance/static-test-graph-ci.json

      - name: Worker boundary check (no api imports)
        run: |
          if grep -rE 'from.*(@ba-helper/api|apps/api/)' apps/worker/src/; then
            echo "BOUNDARY VIOLATION: worker must not import from apps/api"
            exit 1
          fi

      - name: Backend-runtime HTTP and guard boundary check
        run: pnpm verify:backend-runtime-http-boundary

      - name: Backend-runtime boundary check (no api decorators)
        run: |
          if grep -rE --include='*.ts' --exclude='*.spec.ts' --exclude='*.test.ts' '@Controller|@UseGuards|@CurrentUser|@Req|@Get|@Post|@Put|@Delete|@Patch|JwtAuthGuard|RolesGuard' packages/backend-runtime/src/; then
            echo "BOUNDARY VIOLATION: backend-runtime must not contain HTTP controllers or guards"
            exit 1
          fi

      - name: Backend-runtime duplication boundary check
        run: pnpm verify:architecture-boundaries

      - name: Migration upgrade / data survival
        run: pnpm verify:migration-upgrade

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web production build
        run: pnpm --filter web... build

      - name: Build application
        run: pnpm --filter @ba-helper/application build

      - name: Build analyzer
        run: pnpm --filter @ba-helper/analyzer build

      - name: Build backend-runtime
        run: pnpm --filter @ba-helper/backend-runtime build

      - name: Build api
        run: pnpm --filter @ba-helper/api build

      - name: Build worker
        run: pnpm --filter @ba-helper/worker build

      - name: Analyzer tests
        run: pnpm test:analyzer

      - name: App tests
        run: pnpm test:ci

      - name: Web unit tests
        run: pnpm test:web

      - name: E2E tests
        run: pnpm test:e2e

      - name: Golden path demo
        run: pnpm demo:golden-path

      - name: Multi-repo golden path demo
        run: pnpm demo:multi-repo-golden-path

      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser review and report journeys
        run: pnpm test:pw
        env:
          REDIS_URL_TEST: redis://localhost:6379/1

      - name: Seed demo identity for pinned proof
        run: pnpm --dir apps/api exec tsx prisma/seed.demo.ts

      - name: Persist pinned real-repository comprehension proof
        run: pnpm prove:pinned-comprehension

      - name: Verify pinned real-repository browser proof
        run: pnpm verify:pinned-comprehension-browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-review-results
          path: |
            e2e/.artifacts
            artifacts/evaluation/pinned-code-comprehension-proof.json
            artifacts/evaluation/code-comprehension-fanout-e2e.json
          include-hidden-files: true
          if-no-files-found: ignore
