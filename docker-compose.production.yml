# Production overrides. Deploy with:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# Postgres and Redis are NOT published on the host (only the dev override does
# that). Redis requires authentication; REDIS_URL passed to api/worker MUST embed
# the same REDIS_PASSWORD, e.g. redis://:<password>@redis:6379.
services:
  postgres:
    environment:
      POSTGRES_DB: ba_helper
      POSTGRES_USER: ba_helper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-lc", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  api:
    environment:
      NODE_ENV: production
      WORKSPACE_MODE: dev-single-user
      ENABLE_DEV_LOGIN: "false"
      PUBLIC_PREVIEW_MODE: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PUBLIC_BETA_RATE_LIMIT_ENABLED: "true"
      PUBLIC_BETA_RATE_LIMIT_MAX: ${PUBLIC_BETA_RATE_LIMIT_MAX:-30}
      PUBLIC_BETA_RATE_LIMIT_WINDOW_MS: ${PUBLIC_BETA_RATE_LIMIT_WINDOW_MS:-60000}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?EMBEDDING_PROVIDER is required}
      BA_HELPER_PRESERVE_SCAN_WORKSPACE: "false"

  worker:
    environment:
      NODE_ENV: production
      WORKSPACE_MODE: dev-single-user
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?EMBEDDING_PROVIDER is required}
      BA_HELPER_PRESERVE_SCAN_WORKSPACE: "false"

  web:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_USE_MOCK_API: "false"
